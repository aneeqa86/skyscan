# Production stack: PostGIS, Redis, gunicorn API, Celery worker, and nginx
# serving the built frontend and proxying /api. See DEPLOY.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: skyscan-prod

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: skyscan.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn skyscan.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - skyscan_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: skyscan.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: celery -A skyscan worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2} --max-tasks-per-child=20
    volumes:
      - skyscan_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  skyscan_data:
